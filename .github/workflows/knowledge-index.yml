name: Knowledge Index

on:
  push:
    branches: [main]
    paths-ignore:
      - 'governanca/KNOWLEDGE_INDEX.jsonl'
      - 'governanca/KNOWLEDGE_INDEX_META.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build deterministic knowledge index
        run: python tools/build_knowledge_index.py
      - name: Commit index when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governanca/KNOWLEDGE_INDEX.jsonl governanca/KNOWLEDGE_INDEX_META.json
          if git diff --cached --quiet; then
            echo "Knowledge index already current."
            exit 0
          fi
          git commit -m "chore: atualiza índice de conhecimento [skip ci]"
          git push
